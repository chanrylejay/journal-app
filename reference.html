<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sonneto — the cat &amp; the month shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #F2F0F7;
    --raised: #FAF9FD;
    --ink: #33304A;
    --soft: #574B72;
    --faint: #6E6A87;
    --edge: #E3DFEE;
    --rule: #DCD7EA;
    --accent: #6562AC;
    --out: #9C95AC;
    --face: #524C63;
    --fur: #FEFDFC;
    --gray: #BDB6CA;
    --gray-d: #9A92AC;
    --blush: #D6C5CE;
    --aura: #8E86AD;
    --aura-op: 0.13;
    --cat-shadow: #7A6E96;
    --cat-shadow-op: 0.19;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body {
    font-family: var(--sans);
    color: var(--ink);
    padding: 48px 48px 56px;
  }
  header { text-align: center; margin-bottom: 44px; }
  header .title { font-family: "Literata", Georgia, serif; font-size: 30px; margin: 0 0 8px; }
  header .sub { color: var(--soft); font-size: 15px; margin: 0; }
  .faces { display: flex; gap: 34px; justify-content: center; margin: 0 auto 56px; }
  .face { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .face .name { font-size: 12px; color: var(--soft); letter-spacing: 0.04em; }
  .face .state { font-size: 11px; color: var(--faint); margin-top: -4px; }
  .shelf-wrap {
    background: var(--paper);
    border: 1px solid var(--edge);
    border-radius: 16px;
    padding: 20px 12px 16px;
    margin: 0 auto;
  }
  .shelf-wrap svg { display: block; margin: 0 auto; }
  .shelf-key { display: flex; gap: 18px; justify-content: center; margin-top: 16px; font-size: 12px; color: var(--faint); }
  .shelf-key .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>

<header>
  <p class="title">Sonneto</p>
  <p class="sub">a small journal for loud days — a cat, a month shelf, nothing leaves the browser</p>
</header>

<div class="faces" id="faces"></div>
<div class="shelf-wrap" id="shelf"></div>
<div class="shelf-key"><span><span class="dot" style="background:#8492A8"></span>a month</span><span><span class="dot" style="background:#9585AB"></span>a heavy month</span><span><span class="dot" style="background:#8A8DAB"></span>filed by category</span></div>

<script>
/* ------------------------------------------------------------------ */
/*  The cat — one SVG, seven main faces                                */
/* ------------------------------------------------------------------ */

const HEAD_D = "M30 68 C30 44 47 27 79 26 C112 25 130 43 130 67 C130 89 113 106 80 106 C48 107 30 90 30 68 Z";

function eyes(mode) {
  const L = { cx: 62, cy: 72, rx: 6.6, ry: 8 };
  const R = { cx: 99, cy: 71, rx: 6.2, ry: 7.6 };
  const one = (e) => {
    if (mode === "shut") return `<path d="M${e.cx - 8} ${e.cy - 2} q8 8.5 16 0" stroke="var(--face)" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    if (mode === "beam") return `<path d="M${e.cx - 8} ${e.cy + 3} q8 -9.5 16 0" stroke="var(--face)" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    return `<ellipse cx="${e.cx}" cy="${e.cy}" rx="${e.rx}" ry="${e.ry}" fill="var(--face)"/>
      <circle cx="${e.cx + 2.2}" cy="${e.cy - 3.2}" r="2" fill="#FFFFFF" opacity="0.95"/>`;
  };
  return one(L) + one(R);
}

function catInner({ eye = "open", poses = {}, zzz = false, id = 0 }) {
  const g = (n) => (poses[n] ? ` transform="${poses[n]}"` : "");
  return `<defs>
    <radialGradient id="aura${id}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--aura)" stop-opacity="var(--aura-op)"/>
      <stop offset="100%" stop-color="var(--aura)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="patch${id}" cx="50%" cy="50%" r="50%">
      <stop offset="48%" stop-color="var(--gray)" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="var(--gray)" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="headClip${id}"><path d="${HEAD_D}"/></clipPath>
  </defs>
  <circle cx="80" cy="74" r="56" fill="url(#aura${id})"/>
  <ellipse cx="79" cy="147" rx="33" ry="3.8" fill="var(--cat-shadow)" opacity="var(--cat-shadow-op)" filter="url(#soften${id})"/>
  <g transform="rotate(-1.5 80 120)">
    <g${g("jumper")}>
      <g${g("sleep")}>
        <g${g("stretch")}>
          <path${g("tail")} d="M118 124 C142 130 151 117 144 106" stroke="var(--gray)" stroke-width="10.5" stroke-linecap="round" fill="none"/>
          <path d="M38 112 C39 97 57 89 81 89 C107 89 122 98 122 113 C122 128 103 137 79 137 C55 137 38 127 38 112 Z" fill="var(--fur)" stroke="var(--out)" stroke-width="2"/>
          <path d="M61 127 L61 137 C61 143.5 71 143.5 71 137 L71 127 Z" fill="var(--fur)"/>
          <path d="M61 127 L61 137 C61 143.5 71 143.5 71 137 L71 127" fill="none" stroke="var(--out)" stroke-width="2" stroke-linecap="round"/>
          <path d="M90 128 L90 138.5 C90 144.5 99.5 144.5 99.5 138.5 L99.5 128 Z" fill="var(--fur)"/>
          <path d="M90 128 L90 138.5 C90 144.5 99.5 144.5 99.5 138.5 L99.5 128" fill="none" stroke="var(--out)" stroke-width="1.9" stroke-linecap="round"/>
          <g${g("head")}>
            <g stroke="var(--out)" stroke-width="2.1" stroke-linejoin="round">
              <path${g("earl")} d="M42 50 C34 36 33 21 40 18 C47 15 61 26 68 34 Z" fill="var(--fur)"/>
              <path d="M47 46 C42 36 42 28 46 27 C51 26 58 33 62 38 Z" fill="var(--gray)" stroke="none"/>
              <g${g("earr")}>
                <path d="M120 52 C130 37 132 18 123 14 C113 10 96 25 89 34 Z" fill="var(--fur)"/>
                <path d="M115 47 C121 36 122 27 117 26 C111 25 102 33 97 39 Z" fill="var(--gray)" stroke="none"/>
              </g>
            </g>
            <path d="${HEAD_D}" fill="var(--fur)" stroke="var(--out)" stroke-width="2.2"/>
            <g clip-path="url(#headClip${id})">
              <circle cx="24" cy="70" r="30" fill="url(#patch${id})"/>
              <circle cx="137" cy="70" r="30" fill="url(#patch${id})"/>
            </g>
            <g stroke="var(--gray-d)" stroke-width="2.1" stroke-linecap="round" opacity="0.8" fill="none">
              <path d="M36 70 C41 72 45 73.5 49 75"/>
              <path d="M34 83 C39 84 44 84.5 48 85"/>
              <path d="M37 96 C42 95 46 94 49 93"/>
              <path d="M124 71 C119 73 115 74.5 112 76"/>
              <path d="M126 84 C121 85 117 85.5 113 86"/>
            </g>
            <ellipse cx="48" cy="86" rx="11" ry="6.5" fill="var(--blush)" opacity="0.55"/>
            <ellipse cx="110" cy="85" rx="10" ry="7" fill="var(--blush)" opacity="0.55"/>
            <g${g("eyes")}>${eyes(eye)}</g>
            <path d="M76 79 L82 79.5 L79 83 Z" fill="var(--gray-d)"/>
            <path d="M79 83.5 q-4.5 5 -8.5 0.6 M79 83.5 q4.5 5 8.5 0.4" stroke="var(--face)" stroke-width="2" fill="none" stroke-linecap="round"/>
            ${zzz ? `<g fill="var(--faint)" font-size="12" font-family="serif"><text x="122" y="32">z</text><text x="133" y="22">z</text></g>` : ""}
          </g>
        </g>
      </g>
    </g>
  </g>`;
}

function catSvg(opts) {
  return `<svg viewBox="0 0 160 150" width="132" height="124" aria-hidden="true">${catInner(opts)}</svg>`;
}

const FACES = [
  { name: "listening", note: "while you type", eye: "open" },
  { name: "resting", note: "a quiet minute", eye: "shut" },
  { name: "idle", note: "daydreaming", eye: "open" },
  { name: "pleased", note: "something kept", eye: "beam" },
  { name: "sleeping", note: "a long entry", eye: "shut", poses: { sleep: "translate(0 7) scale(1.07 0.88)" }, zzz: true },
  { name: "jumping", note: "petted", eye: "open", poses: { jumper: "translate(0 -24) scale(0.96 1.05)" } },
  { name: "tilt", note: "curious", eye: "open", poses: { head: "rotate(-7 80 104)" } },
];

document.getElementById("faces").innerHTML = FACES.map((f, i) =>
  `<div class="face">${catSvg({ eye: f.eye, poses: f.poses, zzz: f.zzz, id: i })}
     <div class="name">${f.name}</div><div class="state">${f.note}</div></div>`
).join("");

/* ------------------------------------------------------------------ */
/*  The shelf — five years, filled, the cat centred in the middle.
     Its margins align with the first and seventh cat of the row above. */
/* ------------------------------------------------------------------ */

const LIGHT = ["#8492A8", "#AE8B98", "#8CA08E", "#9585AB", "#7A929C", "#B2949B", "#829E96", "#8A8DAB", "#A0808F"];
function fnv(s) { let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
function volumesFor(count) {
  const vols = []; let left = count; let g = 0;
  while (left > 0.001 && g < 6) { const e = Math.min(50, left); vols.push({ kind: vols.length ? "diary" : "mother", e, f: Math.min(1, e) }); left -= e; g++; }
  return vols;
}

function fiveYears() {
  const out = [];
  const now = new Date();
  const endGi = now.getFullYear() * 12 + now.getMonth();
  const startGi = endGi - 60;
  for (let gi = startGi; gi <= endGi; gi++) {
    const year = Math.floor(gi / 12), month = gi % 12;
    const key = `${year}-${month}`;
    const r = fnv(key + "n") % 100;
    let count;
    if (r < 4) count = 0;
    else if (r < 20) count = 2 + (r % 6);
    else if (r < 78) count = 8 + (r % 26);
    else if (r < 94) count = 42 + (r % 12);
    else count = 56 + (r % 22);
    out.push({ key, gi, year, month, count, colorIdx: ((gi % 9) + 9) % 9, spineH: 56 + (fnv(key + "h") % 24), lean: 2 + (fnv(key + "t") % 3) });
  }
  return out;
}

function buildShelf(shelfW) {
  const months = fiveYears();
  const catW = 132;
  const catX = shelfW / 2;               /* the cat sits dead centre */
  const clearZone = 44;
  const tuckCap = 29.5;
  const LEFT_EXT = 10.8, RIGHT_EXT = 6.2; /* bookend footprints */
  const books = [];
  for (const m of months) {
    if (m.count <= 0.001) continue;
    for (const v of volumesFor(m.count)) books.push({ month: m, v });
  }
  const bookWidth = (b) => { const base = b.v.kind === "mother" ? 13 + 20 * (1 - Math.exp(-b.v.e / 18)) : 9 + 12 * (1 - Math.exp(-b.v.e / 18)); return base * b.v.f; };
  const bookHeight = (b) => (b.v.kind === "mother" ? b.month.spineH : b.month.spineH * 0.66) * b.v.f;
  const gapBetween = (a, b) => { const d = b.month.gi - a.month.gi; return d === 0 ? 1.8 : d === 1 ? 4.5 : 13; };
  const tuck = (w) => Math.min(tuckCap, Math.max(0, w - 42) * 0.26);
  const widthOf = (list, s) => { let w = 0; for (let i = 0; i < list.length; i++) { w += bookWidth(list[i]) * s; if (i < list.length - 1) w += gapBetween(list[i], list[i + 1]) * s; } return w; };

  /* balance the split around the cat; a single shelf lands on the right */
  let best = null;
  for (let cut = 0; cut <= books.length; cut++) {
    const left = books.slice(0, cut), right = books.slice(cut);
    const lw = widthOf(left, 1), rw = widthOf(right, 1);
    const score = Math.abs(lw - rw) + (right.length === 0 ? 1000 : 0);
    if (!best || score < best.score) best = { cut, score };
  }
  const leftList = books.slice(0, best.cut), rightList = books.slice(best.cut);
  const lw1 = widthOf(leftList, 1), rw1 = widthOf(rightList, 1);

  /* scale so the whole extent (books + cat's clear zone + bookends) fills the faces row width */
  const extent1 = lw1 + rw1 + (clearZone - tuck(lw1)) + (clearZone - tuck(rw1)) + LEFT_EXT + RIGHT_EXT;
  const scale = Math.max(0.55, Math.min(1, shelfW / extent1));
  const lw = lw1 * scale, rw = rw1 * scale;
  const leftInner = catX - clearZone + tuck(lw);
  const rightInner = catX + clearZone - tuck(rw);

  const placed = [];
  let cx = leftInner;
  for (let i = leftList.length - 1; i >= 0; i--) { const b = leftList[i]; const w = bookWidth(b) * scale; const x = cx - w; placed.push({ ...b, x, w, h: bookHeight(b) * scale }); cx = x - (i > 0 ? gapBetween(leftList[i - 1], leftList[i]) * scale : 0); }
  cx = rightInner;
  for (let i = 0; i < rightList.length; i++) { const b = rightList[i]; const w = bookWidth(b) * scale; placed.push({ ...b, x: cx, w, h: bookHeight(b) * scale }); cx += w + (i < rightList.length - 1 ? gapBetween(rightList[i], rightList[i + 1]) * scale : 0); }
  placed.sort((a, b) => a.x - b.x);

  /* shift so the left bookend lands at 0 (the first cat) and the right at shelfW (the 7th) */
  const leftBooks = placed.filter((p) => p.x < catX).sort((a, b) => a.x - b.x);
  const rightBooks = placed.filter((p) => p.x >= catX).sort((a, b) => b.x - a.x);
  const leftmost = leftBooks.length ? leftBooks[0].x - 2 - 4.6 - 4.2 : 0;
  const rightmost = rightBooks.length ? rightBooks[0].x + rightBooks[0].w + 2 + 4.2 : shelfW;
  const off = (shelfW - (rightmost - leftmost)) / 2 - leftmost;

  const baseline = 96;
  const parts = [];
  for (const b of placed) {
    const lean = b.x < catX ? b.month.lean : -b.month.lean;
    parts.push(`<g transform="translate(${b.x + off + b.w / 2}, ${baseline}) rotate(${lean})" opacity="0.8">
      <rect x="${-b.w / 2}" y="${-b.h}" width="${b.w}" height="${b.h}" rx="1" fill="${LIGHT[b.month.colorIdx]}"/>
      ${b.w > 4 ? `<rect x="${b.w / 2 - 2.2}" y="${-b.h}" width="2.2" height="${b.h}" fill="#fff" opacity="0.14"/>` : ""}
      ${b.w > 14 && b.h > 22 ? `<g stroke="#fff" stroke-width="1" opacity="0.6"><line x1="${-b.w / 2 + 3}" y1="${-b.h * 0.6}" x2="${b.w / 2 - 4}" y2="${-b.h * 0.6}"/><line x1="${-b.w / 2 + 3}" y1="${-b.h * 0.6 + 6}" x2="${b.w / 2 - 4}" y2="${-b.h * 0.6 + 6}"/></g>` : ""}
      <line x1="${-b.w / 2}" y1="${-b.h + 5}" x2="${b.w / 2}" y2="${-b.h + 5}" stroke="#fff" opacity="0.24"/>
      <line x1="${-b.w / 2}" y1="-5.5" x2="${b.w / 2}" y2="-5.5" stroke="#fff" opacity="0.16"/>
    </g>`);
  }
  if (leftBooks.length) {
    const bx = leftBooks[0].x + off - 2 - 4.6;
    parts.push(`<g transform="translate(${bx}, ${baseline})"><rect x="0" y="-42" width="4.6" height="42" rx="1" fill="var(--out)" opacity="0.55"/><rect x="-4.2" y="-3" width="13" height="3" rx="1" fill="var(--out)" opacity="0.55"/></g>`);
  }
  if (rightBooks.length) {
    const bx = rightBooks[0].x + rightBooks[0].w + off + 2;
    parts.push(`<g transform="translate(${bx}, ${baseline})"><rect x="-4.6" y="-42" width="4.6" height="42" rx="1" fill="var(--out)" opacity="0.55"/><rect x="-8.8" y="-3" width="13" height="3" rx="1" fill="var(--out)" opacity="0.55"/></g>`);
  }
  const lineL = leftBooks.length ? leftBooks[0].x + off - 6.8 : 0;
  const lineR = rightBooks.length ? rightBooks[0].x + rightBooks[0].w + off + 6.2 : shelfW;
  parts.push(`<line x1="${lineL}" x2="${lineR}" y1="${baseline + 0.5}" y2="${baseline + 0.5}" stroke="var(--out)" stroke-width="1" opacity="0.24"/>`);

  /* the cat, dead centre, feet on the shelf line */
  const hcat = catW * (150 / 160);
  const catY = baseline - (147 / 150) * hcat;
  parts.push(`<svg x="${catX + off - catW / 2}" y="${catY}" width="${catW}" height="${hcat}" viewBox="0 0 160 150" aria-hidden="true">${catInner({ eye: "open", id: 100 })}</svg>`);

  return `<svg width="${shelfW}" height="${baseline + 24}" viewBox="0 0 ${shelfW} ${baseline + 24}" aria-hidden="true">${parts.join("")}</svg>`;
}

/* build the shelf to span exactly from the first cat to the seventh */
const faceRects = [...document.querySelectorAll(".face")].map((f) => f.getBoundingClientRect());
const shelfW = Math.round(faceRects[faceRects.length - 1].right - faceRects[0].left);
document.getElementById("shelf").style.width = shelfW + "px";
document.getElementById("shelf").innerHTML = buildShelf(shelfW);
</script>
</body>
</html>
